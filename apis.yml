name: Sphero
description: >-
  Sphero designs programmable robots and STEAM (science, technology, engineering, arts and math)
  learning tools for K-12 education. Its product line spans indi, Mini, Snap, BOLT+, littleBits,
  RVR+ and Blueprint robots, paired with standards-aligned curriculum (NGSS, CSTA, ISTE) delivered
  through Sphero Central. For developers and educators, Sphero publishes a public robot-control SDK
  (sdk.sphero.com) that programs Sphero RVR+ / RVR robots from development boards — Raspberry Pi,
  micro:bit and Arduino — using Python, Node.js/TypeScript and C++. Sphero exposes robot-control
  SDKs and a locally-run Node.js RESTful interface rather than a hosted public web API. This profile
  is maintained by API Evangelist as part of the APIs.io network.
